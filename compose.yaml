services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: todo
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U todo -d todo" ]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
  migrate:
    build: .
    command: flask --app app db upgrade
    environment:
      DATABASE_URL: postgresql+psycopg://todo:devpass@db:5432/todo
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
    depends_on:
      db:
        condition: service_healthy
  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://todo:devpass@db:5432/todo
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
    ports:
      - "3001:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
