[project]
name = "todo-app"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "flask-migrate>=4.1.0",
    "flask-sqlalchemy>=3.1.1",
    "gunicorn>=26.1.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.4",
    "sqlalchemy==2.0.52",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["app", "."]
